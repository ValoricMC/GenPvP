# Combat
combat:
  duration: 15           # seconds a player stays tagged after the last hit
  pearl-cooldown: 2.5     # seconds between ender-pearl throws while in combat
  messages:
    # %time% = remaining seconds with 1 decimal place (e.g. "4.8")
    tagged:          "&#FC0000&lCOMBAT &8» &7%time%s"
    untagged:        "&#7AFB00You are no longer in combat."
    command-blocked: "&cYou cannot use commands while in combat."
  spawn-border:
    distance: 5    # blocks from the SPAWN region wall before ghost blocks appear
    message: "&cYou cannot enter the safe zone while in combat."
  # Commands players are allowed to run while in combat (no leading slash, lowercase)
  allowed-commands:
    - helpop
    - msg
    - r

