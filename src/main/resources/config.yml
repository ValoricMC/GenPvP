#   1. Set enabled: true on every server that should participate.
#   2. Give each server a unique server-id (used to skip self-published events).
#   3. All servers must point at the same Redis instance (redis.host above).
#
cross-server:
  enabled: false          # Flip to true once all servers are configured
  server-id: "server-1"  # Unique name for THIS server (e.g. "lobby", "pvp-1", "pvp-2")
  channel: "genpvp:cross:events"  # Redis pub/sub channel (same on all servers)

# Spawn
spawn:
  world: "world"
  x: 135.5
  y: 80.0
  z: -126.5
  yaw: 180.0
  pitch: 0.0
  on-first-join: true   # teleport when a brand-new player joins for the first time
  on-join:       true   # teleport every time a player connects
  on-respawn:    true   # set respawn location after death
  warp-countdown: 5.0   # seconds of countdown before /spawn teleports
  move-threshold: 0.15  # blocks of XZ movement that cancels the warp
  messages:
    countdown: "&#4CC2FA&lS&#80D0FD&lP&#B4DEFF&lA&#80D0FD&lW&#4CC2FA&lN &8» &7 %time%s"
    cancelled:  "&cOops you moved, Warp cancelled!"

