anti-dupe:
  enabled: true
  # Check unstackable items (swords, armor, tools) by PDC UUID
  check-unstackables: true
  # How often to scan all player inventories for duplicate items (ticks, 20 = 1 second)
  scan-interval-ticks: 40
  # Delete the duplicated item from the cheater's inventory
  delete-item: false
  # Send a single chat alert to all online operators
  notify-ops: true
  # Print detection details to the server console / logs
  log-console: true
  # Example: "ban %player% Duping"
  punish-command: ""
  # Minimum seconds between chat alerts for the same player.
  # Detection + logging still happen — only the chat ping is rate-limited.
  alert-cooldown-seconds: 30

money-shard:
  name: "&#70adadShard"
  lore:
