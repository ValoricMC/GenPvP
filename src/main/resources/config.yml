# KOTH Config
koth:
  interval: 1800      # Seconds between automatic KOTH events  (default: 30 min)
  capture_time: 120   # Seconds a player must hold the zone to win (default: 2 min)
  reward_command: "excellentcrates key give %player% legendary 1"  # %player% = winner IGN

  messages:
    # Sent to all players when the KOTH event starts
    start:
      - ""
      - "&#FCD05C&lK&#FFEDBE&lI&#FCD05C&lN&#FFEDBE&lG &#FFEDBE&lO&#FCD05C&lF &#FFEDBE&lT&#FCD05C&lH&#FFEDBE&lE &#FFEDBE&lH&#FCD05C&lI&#FFEDBE&lL&#FCD05C&lL"
      - "&8» &fHead to the capture zone and hold your ground!"
      - ""

    # Sent to all players when an admin force-stops the event
    stop:
      - "&#FCD05C&lK&#FFEDBE&lI&#FCD05C&lN&#FFEDBE&lG &#FFEDBE&lO&#FCD05C&lF &#FFEDBE&lT&#FCD05C&lH&#FFEDBE&lE &#FFEDBE&lH&#FCD05C&lI&#FFEDBE&lL&#FCD05C&lL &8» &fThe King of the Hill event has been forcefully stopped."

    # Sent to all players when someone wins
    # Placeholders: %player% = winner's IGN
    win:
      - ""
      - "  &#FCD05C&lK&#FFEDBE&lI&#FCD05C&lN&#FFEDBE&lG &#FFEDBE&lO&#FCD05C&lF &#FFEDBE&lT&#FCD05C&lH&#FFEDBE&lE &#FFEDBE&lH&#FCD05C&lI&#FFEDBE&lL&#FCD05C&lL &8» &f%player% &fhas captured the King of the Hill!"
      - "  &8» &fCongratulations %player%&f!"
      - ""

    # Sent to all players when someone enters the capture zone
    # Placeholders: %player% = capturer's IGN, %time% = capture seconds remaining
    new_capturer:
      - "&#FCD05C&lK&#FFEDBE&lI&#FCD05C&lN&#FFEDBE&lG &#FFEDBE&lO&#FCD05C&lF &#FFEDBE&lT&#FCD05C&lH&#FFEDBE&lE &#FFEDBE&lH&#FCD05C&lI&#FFEDBE&lL&#FCD05C&lL &8» &f%player% &fis now capturing! &7(%time%s remaining)"

    # Sent to all players when a capture is interrupted (player left the zone)
    capture_interrupted:
      - "&#FCD05C&lK&#FFEDBE&lI&#FCD05C&lN&#FFEDBE&lG &#FFEDBE&lO&#FCD05C&lF &#FFEDBE&lT&#FCD05C&lH&#FFEDBE&lE &#FFEDBE&lH&#FCD05C&lI&#FFEDBE&lL&#FCD05C&lL &8» &fThe capture was interrupted - the timer has reset."

    # Placeholders: %time% = seconds remaining
    actionbar: "&#FCD05CCapturing &8» &7%time%s remaining"

    already_active: "&#FCD05C&lK&#FFEDBE&lI&#FCD05C&lN&#FFEDBE&lG &#FFEDBE&lO&#FCD05C&lF &#FFEDBE&lT&#FCD05C&lH&#FFEDBE&lE &#FFEDBE&lH&#FCD05C&lI&#FFEDBE&lL&#FCD05C&lL &8» &fThe event is already running!"
    not_active:     "&#FCD05C&lK&#FFEDBE&lI&#FCD05C&lN&#FFEDBE&lG &#FFEDBE&lO&#FCD05C&lF &#FFEDBE&lT&#FCD05C&lH&#FFEDBE&lE &#FFEDBE&lH&#FCD05C&lI&#FFEDBE&lL&#FCD05C&lL &8» &fThere is no active KOTH event right now."
    force_started:  "&#FCD05C&lK&#FFEDBE&lI&#FCD05C&lN&#FFEDBE&lG &#FFEDBE&lO&#FCD05C&lF &#FFEDBE&lT&#FCD05C&lH&#FFEDBE&lE &#FFEDBE&lH&#FCD05C&lI&#FFEDBE&lL&#FCD05C&lL &8» &fEvent forcefully started."
    force_stopped:  "&#FCD05C&lK&#FFEDBE&lI&#FCD05C&lN&#FFEDBE&lG &#FFEDBE&lO&#FCD05C&lF &#FFEDBE&lT&#FCD05C&lH&#FFEDBE&lE &#FFEDBE&lH&#FCD05C&lI&#FFEDBE&lL&#FCD05C&lL &8» &fEvent forcefully stopped."
    timeout: "&cKOTH has ended! Nobody captured the hill in time."

