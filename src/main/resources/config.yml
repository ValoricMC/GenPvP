# Devil Fruit ability tuning has been moved to FruitGUI/Balance.yml
# Devil Fruit Shard — PvP kill-drop economy
# When a player kills another, there is a configurable chance to receive
# a physical Amethyst Shard item. The shard is PDC-stamped and can be
# spent in the Devil Fruit shop (currency-type: devil-shards).
devil-fruit-shard:
  drop-chance: 0.10            # 10% chance per kill
  cooldown-hours: 3            # hours before you can receive a shard from the same victim again
  item:
    name: "&#FACBE6&lDEVIL FRUIT &r&fShard"
    lore:
      - "&7Used to purchase devilfruit rolls"
      - "&7on the server."
      - ""
      - "&fꐗ &8» &7Click to open shop"

# one piece
onepiece:
  messages:
    # Sent when a player tries to use an ability inside SPAWN / GENS
    restricted-zone:     "&cAbilities cannot be used in this area."

    # Sent when an ability is still on cooldown. %seconds% = seconds remaining
    cooldown:            "&cOn cooldown! %seconds%s remaining."

    # Luffy Armor — Haki
    haki-block:          "&#FFAF89&lHAKI &8» &7Attack blocked by spirit armor."

    # Luffy Sword — Swipe. %hits% = number of targets hit
    swipe-hit:           "&#FFAA89&lLUFFY &8» &7Swipe struck &f%hits% &7target(s)!"
    swipe-miss:          "&#FFAA89&lLUFFY &8» &7Swipe missed..."

    # Pirate Axe — Throw & Return
    axe-in-flight:       "&#C9E4DE&lPIRATE &8» &7Your axe is still in flight"
    axe-thrown:          "&#C9E4DE&lPIRATE &8» &7Axe thrown"
    axe-returned:        "&#C9E4DE&lPIRATE &8» &7Axe returned"

    # Pirate Sword — Ghost Crew. %seconds% = duration in seconds
    ghost-crew-summoned: "&#C9E4DE&lPIRATE &8» &7Ghost crew summoned for &f %seconds%s&f!"

  box-sphere:
    cooldown-seconds: 120
    messages:
      activated:       "&#73D7F7&lBOX SPHERE &8» &7Sphere deployed!"
      restricted-zone: "&cBox Sphere cannot be used in this area."
      cooldown:        "&cBox Sphere is on cooldown! &7%seconds%s remaining."

  ghost-crew:
    # Lines displayed above each skeleton (supports color codes, multiple lines)
    name-lines:
      - "&7☠ &r&#C9E4DE&lGHOST CREW&r &f☠"
    # Number of segments in the HP bar (each segment = one space character)
    hp-bar-segments: 80

# head abilities
heads:
  messages:
    # Sent when an ability is used inside SPAWN / GENS
    restricted-zone:   "&cAbilities cannot be used here."
    # %seconds% = remaining cooldown with 1 decimal place
    cooldown:          "&cOn cooldown! %seconds%s remaining."
    # Luffy Head — Gear 3 bomb punch. %count% = entities hit, %unit% = "entity"/"entities"
    luffy-gear3:       "&#FAEDCB&lGEAR 3 &8» &7Bombed &f%count% %unit% &7back!"
    # Zoro Head — Purgatory Onigiri dash
    zoro-onigiri:      "&#FAEDCB&lPURGATORY ONIGIRI &8» &fDashing."
    # Nami Head — Mirage Tempo smoke deployment
    nami-mirage-tempo: "&#FAEDCB&lMIRAGE TEMPO &8» &7Smoke deployed."
    # Sanji Head — Ifrit Jambe activation. %seconds% = duration
    sanji-ifrit-start: "&#FAEDCB&lIFRIT JAMBE &8» &7Fire legs active for &f%seconds% &7seconds"
    # Sanji Head — Ifrit Jambe expiry
    sanji-ifrit-end:   "&#FAEDCB&lIFRIT JAMBE &8» &7Fire faded."

# genpvp admin commands
genpvp:
  messages:
    no-permission:        "&cYou do not have permission to execute this command."
    usage:                "&cTry using: /genpvp <reload | item_give | onepiece | head>"
    reload-success:       "&#DBCDF0&lGENPVP &8» &7Configuration and shops reloaded successfully."
    item-give-usage:      "&cTry using: /genpvp item_give <item> [player]"
    # %items% = comma-separated list of known items
    item-give-available:  "&#DBCDF0&lGENPVP &8» &f%items%"
    # %item% = the name the sender typed
    item-give-unknown:    "&#DBCDF0&lGENPVP &8» &7Unknown Item &f%item%"
    # %item% = item name — sent to the recipient
    item-give-received:   "&#DBCDF0&lGENPVP &8» &7You recived &f%item%!"
    # %item% = item name, %player% = recipient name — sent to the admin
    item-gave-to:         "&#DBCDF0&lGENPVP &8» &f%item% &7to &f%player%."
    # %player% = name that was not found online
    player-not-found:     "&#DBCDF0&lGENPVP &8» &7Player not found &f%player%"
    player-required:      "&cTry using: /genpvp item_give <item> <player>"
    # %subcmd% = "onepiece" or "head"
    register-usage:       "&cTry using: /genpvp %subcmd% set from_hand <name>"
    # %names% = comma-separated suggested names
    register-names:       "&#DBCDF0&lGENPVP &8» &7Names &f%names%"
    register-hand-only:   "&cTry using: 'from_hand' only."
    register-player-only: "&#DBCDF0&lGENPVP &8» &7Error: player not found"
    register-hold-item:   "&cTry using: Holding_item."
    # %name% = the key it was registered under
    register-success:     "&#DBCDF0&lGENPVP &8» &7Registered held item as &f%name%&f."
