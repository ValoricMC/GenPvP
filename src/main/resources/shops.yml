# ──────────────────────────────────────────────────────────────────────────────
# GenPvP Shop Configuration
# ──────────────────────────────────────────────────────────────────────────────
#
# GUI Layout (6-row chest = 54 slots):
#
#   Row 0  (slots  0- 8)  ← shared-nav category buttons
#   Rows 1-4 (slots 9-44) ← shop items (4 × 9 = 36 item slots)
#   Row 5  (slots 45-53)  ← [-] decrease (52), [+] increase (53)
#
# default-menu — The menu that opens when a player runs /shop with no args.
#
# shared-nav — Navigation buttons injected into EVERY menu.
#
# Per-menu sections:
#   items:        — Buyable/sellable items.
#   buttons:      — Navigation buttons that open another menu.
#   slot-buttons: — Decorative items (e.g. STONE_BUTTONs) with custom lore; no buy/sell action.
#
# requires-prestige — Prestige level required to buy the item.
#   0 = no prestige required (anyone can buy)
#   N = requires prestige level N (e.g. 2 means the player needs Prestige 2)
#   If the player doesn't meet the requirement, the last lore line changes to
#   "&cRequires Prestige level N." and a configurable actionbar message is sent.
#
# ──────────────────────────────────────────────────────────────────────────────

