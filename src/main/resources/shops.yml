# slot:                GUI slot (9-44 = item area in a 6-row chest)
# material:            Bukkit Material name (e.g. DIAMOND_SWORD)
# name:                Display name (supports & and &#RRGGBB colour codes)
# price:               Base cost per purchase (multiplied by quantity)
# amount:              How many items the player receives per purchase
# currency-type:       "money" (default) | "shards" | "gold" | "devil-shards"
#                      - money/shards/gold use the virtual BankManager balance
#                      - devil-shards uses physical PDC-stamped Amethyst Shards
#                        in the player's inventory
# allow-multiple:      true = player can increase quantity with +/- buttons
# requires-prestige:   Minimum prestige level (0 = none)
# command:             Console command to run instead of giving items.
#                      Placeholders: %player_name%, %amount%
#                      Example: "fruit roll_give %player_name% paramecia 1"
# lore:                List of lore lines. Placeholder: %amount%
# enchants:            List of "enchantment_key:level" strings
# potions:             List of "effect_key:amplifier:duration_seconds" strings
# item-id:             PDC tag value for item tier progression
# after-store-bought-title: Custom name applied to the given item
# after-store-bought-lore:  Custom lore applied to the given item
# unbreakable:         true = item cannot lose durability
# requires-item:       Gate purchase behind having another item in inventory
#
# ── CURRENCY TYPES ─────────────────────────────────────────────────────────────
# money          Virtual balance (BankManager) — earned from mining/selling
# shards         Virtual balance (BankManager) — deposited Money Shards
# gold           Virtual balance (BankManager) — earned from events
# devil-shards   Physical AMETHYST_SHARD items with PDC tag genpvp:devil_fruit_shard
#                obtained from PvP kills (10% chance, 3h per-victim cooldown)
