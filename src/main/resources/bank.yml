  name: "&#F1C176%player%"
  lore:
    - ""
    - "&#A7A7A7Balance: &#F1C176$%balance%"
    - "&#A7A7A7Shards in inventory: &#F1C176%shards%"
    - ""

  deposit-1:
    slot: 12
    material: GREEN_CONCRETE_POWDER
    amount: 1
    name: "&#7AFB00Deposit &7%amount% &#7AFB00Shard(s)"
